# projects section data
- name: agentic-uav
  gh_user: MartinezAgullo
  repo: agentic-tello
  desc: An agent that flies a DJI Tello drone from goals written in natural language, such as "find the backpack and take a picture". It sees through the onboard camera and acts through a set of flight tools. Everything runs locally, on an NVIDIA DGX Spark or on an Apple Silicon laptop.
  img: ../images/repos/agentic-drone.png

- name: magi
  gh_user: MartinezAgullo
  repo: magi-system-autogen
  desc: Voice-first multi-agent deliberation running on a Raspberry Pi 5. Three LLMs with deliberately opposing temperaments debate a spoken question until they reach a verdict. Built with Microsoft AutoGen and traced end to end with OpenTelemetry, so what a framework costs on an edge node is measured instead of argued.
  img: ../images/repos/magi.png

- name: cmop-map
  gh_user: MartinezAgullo
  repo: cmop_map
  desc: A web application for managing and visualising the Common Medical Operating Picture (CMOP) on an interactive map using PostGIS. Used as an external monitor to display the activity of different multi-agent systems in real time. The backend is built with FastAPI and the frontend with React and Leaflet.
  img: ../images/repos/cmop-map.png

- name: agents-tactical-analysis
  gh_user: MartinezAgullo
  repo: agents-crewai-tactical-multimodal
  desc: A multi-agent system built with CrewAI that simulates a tactical military analysis pipeline. It processes diverse inputs, including text reports, images and audio files, and subscribes to an MQTT publisher to receive incoming data in real time, enabling dynamic analysis and response. Telemetry is monitored with OpenObserve.
  img: ../images/repos/land_tactical_ai.png

- name: agents-lg-emergency-assistant
  gh_user: MartinezAgullo
  repo: agents-lg-emergency-assistant
  desc: LangGraph-based agentic system for critical decisions in emergency scenarios. The agents collaborate to analyse threats and automatically generate an evacuation plan, following an Evaluator-Optimizer pattern to keep the quality of the emergency response high. Telemetry is monitored with LangSmith.
  img: ../images/repos/emergency-map.png

- name: naval-agentic-ai
  gh_user: MartinezAgullo
  repo: naval-agentic-ai
  desc: Three CrewAI-based prototypes of AI agents for electronic warfare in the naval domain. The first one analyses electromagnetic signals from naval sensors, assesses threat levels and recommends tactical responses that minimise the risk of detection. The second one detects the impact of cyber-attacks and executes countermeasures with a human in the loop.
  img: ../images/repos/naval_ai.png

- name: tifda
  gh_user: MartinezAgullo
  repo: genai-tifda
  desc: The Tactical Information Fusion and Dissemination Agent (TIFDA) is a GenAI agent-based tool that works as a processing and distribution centre for tactical information in a combat environment. Built with LangGraph.
  img: ../images/repos/tifda_cover.jpg

- name: agent-creator-autogen
  gh_user: MartinezAgullo
  repo: agent-creator-autogen
  desc: Multi-agent system that dynamically creates and coordinates new autonomous AI agents using Microsoft AutoGen.
  img: ../images/repos/skynet_mug.jpg

- name: root-with-python
  gh_user: MartinezAgullo
  repo: root-with-python
  desc: Collection of scripts that combine Python and ROOT for data analysis. The TMVA folder contains a machine learning tool based on the TMVA library.
  img: ../images/repos/Root_with_Python_2.png

- name: xgboost-thq
  gh_user: MartinezAgullo
  repo: xgboost-thq
  desc: Collection of Python scripts to train, optimise and inject a Boosted Decision Tree using the XGBoost library.
  img: ../images/repos/GradientBoosting.png

