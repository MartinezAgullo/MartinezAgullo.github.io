# projects section data
- name: agents-tactical-analysis
  gh_user: MartinezAgullo
  repo: agents-crewai-tactical-multimodal
  desc: A multi-agent system with the <a href="https://www.crewai.com/">CrewAI</a> designed to simulate a tactical military analysis pipeline. It is capable of processing diverse inputs—including text reports, images, and audio files. The tool is suscribed to a <a href="https://mqtt.org/">MQTT</a> publisher to receive incoming data in real-time, enabling dynamic analysis and response. Uses <a href="https://openobserve.ai/">OpenObserve</a> for telemetry monitoring.
  img: ../images/repos/land_tactical_ai.png

- name: agents-lg-emergency-assistant
  gh_user: MartinezAgullo
  repo: agents-lg-emergency-assistant
  desc: <a href="https://www.langchain.com/langgraph">LangGraph</a>-based agentic system for critical decisions in emergency scenarios. The agents collaborate to analyze threats and automatically generate and evacuation plan using an Evaluator-Optimizer pattern to ensure high-quality emergency response. Uses <a href="https://www.langchain.com/langsmith/observability">LangSmith</a> for telemetry monitoring.
  img: ../images/repos/emergency-map.png

- name: naval-agentic-ai
  gh_user: MartinezAgullo
  repo: naval-agentic-ai
  desc: Three <a href="https://www.crewai.com/">CrewAI</a>-based AI-agents prototypes for electronic warfare in the naval domain. The first system can analyze electromagnetic signals from naval sensors, assesses threat levels, and recommends tactical responses to minimize detection risk. The second prototype focuses on detecting the impact of cyber-attacks and executing countermeasures with a HILT.
  img: ../images/repos/naval_ai.png

- name: tifda
  gh_user: MartinezAgullo
  repo: genai-tifda
  desc: The Tactical Information Fusion and Dissemination Agent (TIFDA) is GenAI agent-based tool that functions as a processing and distribution center for tactical information in a combat environment. Build with <a href="https://www.langchain.com/langgraph">LangGraph</a>.
  img: ../images/repos/tifda_cover.jpg

- name: agent-creator-autogen
  gh_user: MartinezAgullo
  repo: agent-creator-autogen
  desc: Multi-agent system that dynamically creates and coordinates new autonomous AI agents using <a href="https://www.microsoft.com/en-us/research/project/autogen/">Microsoft AutoGen</a>.
  img: ../images/repos/skynet_mug.jpg

- name: root-with-python
  gh_user: MartinezAgullo
  repo: root-with-python
  desc: Collection of scripts that combine Python and <a href="https://root.cern/">ROOT</a> for data analysis. The folder <a href="https://github.com/MartinezAgullo/Root_with_Python/tree/main/TMVA">TMVA</a> contains a Machine-Learning tool based on the <a href="https://root.cern/manual/tmva/">TMVA</a> library.
  img: ../images/repos/Root_with_Python_2.png

- name: xgboost-thq
  gh_user: MartinezAgullo
  repo: xgboost-thq
  desc: Collection of Python scripts to train, optimise and inject a Boosted Decision Tree using the <a href="https://xgboost.readthedocs.io/en/stable/">XGBoost</a> library.
  img: ../images/repos/GradientBoosting.png

- name: inner-detector-alignment-web-monitor
