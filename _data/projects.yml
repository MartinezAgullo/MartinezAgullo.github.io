- name: pygame-monkey-jump
  gh_user: MartinezAgullo
  repo: pygame-monkey-jump
  desc: Game based on the <a href="https://www.pygame.org/news">pygame</a> framework and inspired by the Dinosaur Game built into the Google Chrome web browser. Later a reinforcement learning algorithm learns to play it in the project <a href="https://github.com/MartinezAgullo/Learn_MonkeyJump">Learn_MonkeyJump</a>.
  img: ../images/repos/Monkey_1.png

- name: rl-blackjack
  gh_user: MartinezAgullo
  repo: rl-blackjack
  desc: Implementation of a single agent reinforced learning algorithm based on <a href="https://gymnasium.farama.org/index.html/">Gymnasium</a>'s <a href="https://gymnasium.farama.org/environments/toy_text/">pygame</a> environment. The Q-agent learns to play the popular game of BlackJack.
  img: ../images/repos/BlackJack_RL.png

- name: task-planner
  gh_user: MartinezAgullo
  repo: task-planner
  desc: A clean architecture Python project using FastAPI, PostgreSQL, and Poetry. This task planner is built with a hexagonal architecture and SOLID principles, designed to manage tasks with priorities and dependencies.
  img: ../images/repos/task_planner.jpeg

- name: genAI-img-captioner
  gh_user: MartinezAgullo
  repo: genai-1-img-captioner
  desc: Tools to perform automatic image captioning. Based on <a href="https://pytorch.org/vision/stable/index.html">PyTorch's torchvision</a> and  <a href="https://huggingface.co/docs/transformers/en/model_doc/blip">HuggingFace's BLIP</a>. The web interfaces are obtained using <a href=" https://www.gradio.app/">Gradio</a>.
  img: ../images/repos/GenAI_ImgCaptioner1.png

- name: genAI-chat-bot
  gh_user: MartinezAgullo
  repo: genai-2-web-chatbot
  desc: Chatbot with Open Source LLMs using Python and <a href="https://huggingface.co/models">Hugging Face</a>. <a href="https://huggingface.co/facebook/blenderbot-400M-distill">blenderbot</a>. <a href="https://flask.palletsprojects.com/en/3.0.x/">Flask</a> is used for hosting the backend service.
  img: ../images/repos/GenAI_2_WebChatbot_Interface.png

- name: genAI-voice-assistant
  gh_user: MartinezAgullo
  repo: genai-3-voice-assistant
  desc: Voice Assistant with Open AI's <a href="https://platform.openai.com/docs/models">GPT-3</a> and <a href="https://developer.ibm.com/articles/watson-libraries-embeddable-ai-that-works-for-you/">IBM Watson</a> embeddable AI. <a href="https://flask.palletsprojects.com/en/3.0.x/">Flask</a> is used for hosting the backend service.
  img: ../images/repos/GenAI_3_VoiceAssistant.png 

- name: genAI-meeting-companion
  gh_user: MartinezAgullo
  repo: genai-4-meeting-assistant
  desc: Application to transcribe discussions and provides a concise summary of a meeting. OpenAI's <a href="https://openai.com/index/whisper/">Whisper</a> is used for speech-to-text and IBM <a href="https://developer.ibm.com/tutorials/use-the-watson-core-nlp-library-to-perform-sentiment-analysis/">Watson's AI</a> to summarize and find key points. Interfaced with <a href=" https://www.gradio.app/">Gradio</a>.
