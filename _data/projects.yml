- name: task-planner
  gh_user: MartinezAgullo
  repo: task-planner
  desc: A clean architecture Python project using FastAPI, PostgreSQL and Poetry. This task planner is built with a hexagonal architecture and SOLID principles, designed to manage tasks with priorities and dependencies.
  img: ../images/repos/task_planner.jpeg

- name: genAI-img-captioner
  gh_user: MartinezAgullo
